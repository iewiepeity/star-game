name: Pixel action art verification
on:
  push:
    branches: [codex/pixel-action-art]
permissions:
  contents: read
jobs:
  action-art:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/pixel-action-art.test.mjs
      - run: npx playwright test tests/e2e/pixel-action-art.spec.mjs --project=desktop --project=mobile --workers=2 --reporter=line
      - name: Save screenshots and failure diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pixel-action-art-verification
          path: test-results/
          retention-days: 7
