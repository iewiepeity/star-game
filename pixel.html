<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#f9f3e8" />
    <title>星途未定 · 像素生活</title>
    <link rel="icon" href="assets/icons/favicon-32.png" />
    <link rel="stylesheet" href="pixel.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="pixel.html"
        ><span>✦</span> 星途未定 <small>像素生活</small></a
      ><span id="save-status" role="status">載入場景中…</span>
    </header>
    <main id="world-shell">
      <div
        id="world"
        role="application"
        aria-label="像素場景。點地面移動、點家具或人物互動。也可從選單查看附近物件。"
        tabindex="0"
      ></div>
      <div id="loading">
        <span class="spark">✦</span><strong>正在搬進星望市</strong
        ><span id="load-progress">整理房間與行李…</span>
      </div>
      <section class="scene-title">
        <span class="eyebrow">STARLIGHT DAYS · 自由探索</span>
        <h1 id="room-title">我的住處</h1>
        <p id="room-subtitle">一切從這個小房間開始</p>
      </section>
      <div id="activity-strip" hidden>
        <span id="activity-label"></span
        ><progress
          id="activity-progress"
          max="1"
          value="0"
          aria-label="活動進度"
        ></progress
        ><button data-ui="stop-activity">結束動作</button>
      </div>
      <div id="world-hint">點地面走走 · 點家具與人物互動</div>
    </main>
    <footer class="bottom-bar">
      <div class="player-chip">
        <img
          id="player-head"
          src="assets/avatars/raven-newcomer.webp"
          alt="你的角色"
        /><span
          ><b id="player-name">星途新人</b
          ><small id="outfit-label">新人私服</small></span
        >
      </div>
      <button class="menu-button" data-ui="menu" aria-label="開啟選單">
        <span aria-hidden="true">☷</span> 選單
      </button>
    </footer>
    <section
      id="dialogue"
      class="dialogue-dock"
      role="dialog"
      aria-modal="true"
      aria-labelledby="dialogue-name"
      hidden
    ></section>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="panel" aria-labelledby="panel-title">
      <button class="close-panel" data-ui="close" aria-label="關閉視窗">
        ×
      </button>
      <div id="panel-content"></div>
    </dialog>
    <script type="module" src="src/pixel/main.js"></script>
  </body>
</html>
